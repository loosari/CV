  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #2c6e8a;
      --accent-light: #e8f4f8;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── Hero ── */
    .hero { display: flex; gap: 2rem; align-items: center; background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
    .hero img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid var(--accent-light); }
    .hero-name { font-size: 1.7rem; font-weight: 700; }
    .hero-title { color: var(--accent); font-size: 1rem; margin-bottom: .5rem; }
    .hero-meta { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; }
    .hero-meta span::before { margin-right: .3rem; }

    /* ── Sections ── */
    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 1.5rem; }
    .section-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border-bottom: 2px solid var(--accent-light); padding-bottom: .4rem; margin-bottom: 1rem; }

    /* ── Profile ── */
    .profile-text { font-size: .95rem; color: #374151; }

    /* ── Skills ── */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .6rem; }
    .skill-item { font-size: .88rem; }
    .skill-bar { height: 5px; background: var(--border); border-radius: 99px; margin-top: 3px; }
    .skill-fill { height: 100%; background: var(--accent); border-radius: 99px; }

    /* ── Soft skills ── */
    .tags { display: flex; flex-wrap: wrap; gap: .5rem; }
    .tag { background: var(--accent-light); color: var(--accent); font-size: .82rem; padding: .25rem .7rem; border-radius: 99px; }

    /* ── Timeline items (education, publications, courses) ── */
    .timeline-item { padding-left: 1rem; border-left: 2px solid var(--accent-light); margin-bottom: 1.2rem; }
    .timeline-item:last-child { margin-bottom: 0; }
    .item-title { font-weight: 600; font-size: .95rem; }
    .item-sub { font-size: .85rem; color: var(--accent); }
    .item-meta { font-size: .82rem; color: var(--muted); margin-top: .15rem; }
    .item-desc { font-size: .85rem; color: #4b5563; margin-top: .3rem; }

    /* ── Languages ── */
    .lang-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .lang-item { text-align: center; }
    .lang-name { font-weight: 600; font-size: .9rem; }
    .lang-level { font-size: .8rem; color: var(--muted); }

    /* ── Social links ── */
    .social-links { display: flex; flex-wrap: wrap; gap: .6rem; }
    .social-link { display: inline-flex; align-items: center; gap: .4rem; background: var(--accent-light); color: var(--accent); font-size: .85rem; padding: .35rem .8rem; border-radius: 8px; }
    .social-link:hover { background: var(--accent); color: white; text-decoration: none; }

    /* ── Footer ── */
    footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 1rem 0 2rem; }

    @media (max-width: 540px) {
      .hero { flex-direction: column; text-align: center; }
      .hero-meta { justify-content: center; }
    }
  </style>
