<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#667eea,#764ba2,#06b6d4,#5b6af0,#8b5cf6);background-size:400% 400%;animation:bgA 14s ease infinite;opacity:.10}
[data-theme="dark"] body::before{opacity:.18}
@keyframes bgA{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#tbtn{position:fixed;top:18px;right:18px;z-index:999;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:50px;padding:8px 18px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--sh);transition:all .3s}

.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px 60px}
.hcard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);border-radius:28px;padding:52px 44px;max-width:680px;width:100%;box-shadow:var(--sh);text-align:center;animation:fadeUp .7s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.av-wrap{position:relative;display:inline-block;margin-bottom:26px}
.av-ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--accent),var(--accent2),#06b6d4,var(--accent));animation:spin 5s linear infinite;z-index:0}
.av-ring::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.av-inner{position:relative;z-index:1;width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;border:3px solid var(--bg)}
.hname{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.hpos{font-size:16px;color:var(--text2);font-weight:500;margin-bottom:5px}
.hloc{font-size:13px;color:var(--text3);margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(91,106,240,.08);border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:13px;color:var(--text2);font-weight:500;transition:all .25s}
.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.npills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.npill{padding:7px 16px;border-radius:50px;font-size:13px;font-weight:600;background:transparent;border:1.5px solid var(--border);color:var(--text2);cursor:pointer;transition:all .25s;font-family:'Inter',sans-serif}
.npill:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 6px 18px rgba(91,106,240,.30)}
.sec{padding:72px 0;opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}
.sec.vis{opacity:1;transform:translateY(0)}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.sico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:0 4px 14px rgba(91,106,240,.28)}
.stitle{font-size:24px;font-weight:700;color:var(--text)}
.sline{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
.card{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);border-radius:var(--r);padding:26px;box-shadow:var(--sh);transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.ptext{font-size:15px;color:var(--text2);line-height:1.85}
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--accent),var(--accent2),transparent);border-radius:2px}
.tli{position:relative;margin-bottom:28px}
.tli:last-child{margin-bottom:0}
.tldot{position:absolute;left:-26px;top:7px;width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.tlcard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:all .3s}
.tlcard:hover{box-shadow:var(--sh2);transform:translateX(4px)}
.tlbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:4px}
.tlschool{font-size:17px;font-weight:700;color:var(--text);margin-bottom:3px}
.tlfield{font-size:14px;color:var(--text2);margin-bottom:10px}
.tldur{display:inline-block;font-size:12px;color:var(--text3);background:rgba(91,106,240,.08);padding:3px 10px;border-radius:50px;margin-bottom:14px}
.tldet{font-size:13px;color:var(--text2);line-height:1.8}
.tldet p{margin-bottom:3px}
.tldet strong{color:var(--text);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ski{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:12px;padding:16px 18px;box-shadow:var(--sh);transition:all .3s}
.ski:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.ktop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kname{font-size:13px;font-weight:600;color:var(--text)}
.kdots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(91,106,240,.12);border:1.5px solid var(--border);transition:background .4s}
.dot.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.ktrack{height:4px;background:rgba(91,106,240,.10);border-radius:50px;overflow:hidden}
.kfill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
.softwrap{display:flex;flex-wrap:wrap;gap:10px}
.softchip{padding:8px 16px;border-radius:50px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text2);backdrop-filter:blur(8px);transition:all .25s;cursor:default}
.softchip:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 6px 16px rgba(91,106,240,.25)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:var(--r);padding:22px;text-align:center;box-shadow:var(--sh);transition:all .3s}
.lcard:hover{box-shadow:var(--sh2);transform:translateY(-4px)}
.lname{font-size:17px;font-weight:700;color:var(--text);margin-bottom:3px}
.llbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:14px}
.lring{width:68px;height:68px;margin:0 auto 10px}
.lring svg{width:100%;height:100%}
.rtrack{fill:none;stroke:rgba(91,106,240,.12);stroke-width:6}
.rfill{fill:none;stroke-width:6;stroke-linecap:round;stroke:url(#lg);stroke-dasharray:188;stroke-dashoffset:188;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:all .3s}
.ccard:hover{box-shadow:var(--sh2);transform:translateY(-4px)}
.cico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px}
.cname{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:5px}
.cinst{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.plist{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:all .3s;display:flex;gap:16px;align-items:flex-start}
.pcard:hover{box-shadow:var(--sh2);transform:translateX(5px)}
.pyr{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;text-align:center;min-width:46px;flex-shrink:0;line-height:1.3}
.pbody{flex:1;min-width:0}
.ptitle{font-size:14px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:6px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pjournal{font-size:12px;color:var(--accent);font-weight:600}
.pauthors{font-size:12px;color:var(--text3)}
.pcited{font-size:11px;background:rgba(91,106,240,.10);color:var(--text3);padding:2px 8px;border-radius:50px;font-weight:500}
.pdoi{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);font-weight:500;margin-top:7px}
.pdoi:hover{color:var(--accent2)}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lkcard{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(12px);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:all .3s;display:flex;align-items:center;gap:12px;color:var(--text)}
.lkcard:hover{box-shadow:var(--sh2);transform:translateY(-4px);color:var(--text)}
.lkico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lklbl{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.lkval{font-size:13px;color:var(--text);font-weight:600;word-break:break-all}
footer{text-align:center;padding:36px 20px;font-size:13px;color:var(--text3);border-top:1px solid var(--border);margin-top:20px}
@media(max-width:580px){.hcard{padding:36px 22px}.pcard{flex-direction:column}.sec{padding:52px 0}}
</style>
</head>
