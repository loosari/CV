<parameter name="content"><!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rasool Hamidi Choolabi — Psychologist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* ─── CSS Variables ─────────────────────────────────────────── */
:root {
--bg:          #f4f6fb;
--bg2:         #eef1f8;
--surface:     rgba(255,255,255,0.75);
--surface2:    rgba(255,255,255,0.55);
--border:      rgba(255,255,255,0.6);
--text:        #1a1d2e;
--text2:       #4a5068;
--text3:       #7a82a0;
--accent:      #5b6af0;
--accent2:     #8b5cf6;
--accent3:     #06b6d4;
--card-shadow: 0 4px 24px rgba(91,106,240,0.10);
--card-hover:  0 12px 40px rgba(91,106,240,0.18);
--radius:      16px;
--radius-sm:   10px;
--transition:  0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
--bg:          #0f1117;
--bg2:         #161922;
--surface:     rgba(30,34,50,0.80);
--surface2:    rgba(30,34,50,0.60);
--border:      rgba(255,255,255,0.08);
--text:        #e8eaf6;
--text2:       #9fa3be;
--text3:       #5c6080;
--card-shadow: 0 4px 24px rgba(0,0,0,0.40);
--card-hover:  0 12px 40px rgba(91,106,240,0.25);
}

/* ─── Reset & Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
font-family: 'Inter', sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.6;
transition: background var(--transition), color var(--transition);
overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--accent2); }
img { display: block; max-width: 100%; }

/* ─── Animated Gradient Background ─────────────────────────── */
.hero-bg {
position: fixed;
inset: 0;
z-index: -1;
background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #06b6d4 50%, #5b6af0 75%, #8b5cf6 100%);
background-size: 400% 400%;
animation: gradientShift 12s ease infinite;
opacity: 0.12;
}
[data-theme="dark"] .hero-bg { opacity: 0.18; }
@keyframes gradientShift {
0%   { background-position: 0% 50%; }
50%  { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* ─── Layout ────────────────────────────────────────────────── */
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

/* ─── Theme Toggle ──────────────────────────────────────────── */
.theme-toggle {
position: fixed;
top: 20px;
right: 20px;
z-index: 100;
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: 50px;
padding: 8px 16px;
cursor: pointer;
font-size: 18px;
box-shadow: var(--card-shadow);
transition: all var(--transition);
display: flex;
align-items: center;
gap: 6px;
color: var(--text);
font-family: 'Inter', sans-serif;
font-size: 13px;
font-weight: 500;
}
.theme-toggle:hover { box-shadow: var(--card-hover); transform: translateY(-1px); }
.theme-toggle .icon { font-size: 16px; }

/* ─── Hero Section ──────────────────────────────────────────── */
.hero {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 80px 20px 60px;
position: relative;
}
.hero-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-radius: 28px;
padding: 56px 48px;
max-width: 700px;
width: 100%;
box-shadow: var(--card-shadow);
text-align: center;
animation: fadeUp 0.8s ease both;
}
@keyframes fadeUp {
from { opacity: 0; transform: translateY(30px); }
to   { opacity: 1; transform: translateY(0); }
}

/* Avatar */
.avatar-wrap {
position: relative;
display: inline-block;
margin-bottom: 28px;
}
.avatar-ring {
position: absolute;
inset: -6px;
border-radius: 50%;
background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
animation: spin 6s linear infinite;
z-index: 0;
}
.avatar-ring::after {
content: '';
position: absolute;
inset: 3px;
border-radius: 50%;
background: var(--bg);
}
@keyframes spin {
from { transform: rotate(0deg); }
to   { transform: rotate(360deg); }
}
.avatar-img {
width: 130px;
height: 130px;
border-radius: 50%;
object-fit: cover;
position: relative;
z-index: 1;
border: 3px solid var(--bg);
}
.avatar-placeholder {
width: 130px;
height: 130px;
border-radius: 50%;
background: linear-gradient(135deg, var(--accent), var(--accent2));
display: flex;
align-items: center;
justify-content: center;
font-size: 48px;
font-weight: 700;
color: #fff;
position: relative;
z-index: 1;
border: 3px solid var(--bg);
}

.hero-name {
font-family: 'Plus Jakarta Sans', sans-serif;
font-size: clamp(28px, 5vw, 42px);
font-weight: 800;
letter-spacing: -0.5px;
background: linear-gradient(135deg, var(--accent), var(--accent2));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
margin-bottom: 8px;
}
.hero-position {
font-size: 17px;
color: var(--text2);
font-weight: 500;
margin-bottom: 20px;
}
.hero-location {
font-size: 14px;
color: var(--text3);
margin-bottom: 28px;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

/* Contact chips */
.contact-chips {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
margin-bottom: 28px;
}
.chip {
display: inline-flex;
align-items: center;
gap: 6px;
background: var(--surface2);
border: 1px solid var(--border);
backdrop-filter: blur(8px);
border-radius: 50px;
padding: 7px 14px;
font-size: 13px;
color: var(--text2);
font-weight: 500;
transition: all var(--transition);
}
.chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); }
.chip .chip-icon { font-size: 14px; }

/* Nav pills */
.hero-nav {
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
}
.nav-pill {
padding: 8px 18px;
border-radius: 50px;
font-size: 13px;
font-weight: 600;
background: transparent;
border: 1.5px solid var(--border);
color: var(--text2);
cursor: pointer;
transition: all var(--transition);
font-family: 'Inter', sans-serif;
}
.nav-pill:hover {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff;
border-color: transparent;
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(91,106,240,0.3);
}

/* ─── Sections ──────────────────────────────────────────────── */
.section {
padding: 80px 0;
opacity: 0;
transform: translateY(24px);
transition: opacity 0.6s ease, transform 0.6s ease;
}
.section.visible { opacity: 1; transform: translateY(0); }

.section-header {
display: flex;
align-items: center;
gap: 14px;
margin-bottom: 40px;
}
.section-icon {
width: 44px;
height: 44px;
border-radius: 12px;
background: linear-gradient(135deg, var(--accent), var(--accent2));
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
flex-shrink: 0;
box-shadow: 0 4px 14px rgba(91,106,240,0.3);
}
.section-title {
font-family: 'Plus Jakarta Sans', sans-serif;
font-size: 26px;
font-weight: 700;
color: var(--text);
}
.section-line {
flex: 1;
height: 1px;
background: linear-gradient(to right, var(--border), transparent);
}

/* ─── Glass Card ────────────────────────────────────────────── */
.glass-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-radius: var(--radius);
padding: 28px;
box-shadow: var(--card-shadow);
transition: box-shadow var(--transition), transform var(--transition);
}
.glass-card:hover { box-shadow: var(--card-hover); transform: translateY(-3px); }

/* ─── Profile ───────────────────────────────────────────────── */
.profile-text {
font-size: 15.5px;
color: var(--text2);
line-height: 1.8;
}

/* ─── Education Timeline ────────────────────────────────────── */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
content: '';
position: absolute;
left: 8px;
top: 8px;
bottom: 8px;
width: 2px;
background: linear-gradient(to bottom, var(--accent), var(--accent2), transparent);
border-radius: 2px;
}
.timeline-item {
position: relative;
margin-bottom: 32px;
}
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
position: absolute;
left: -28px;
top: 6px;
width: 14px;
height: 14px;
border-radius: 50%;
background: linear-gradient(135deg, var(--accent), var(--accent2));
box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
}
.timeline-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-radius: var(--radius);
padding: 24px;
box-shadow: var(--card-shadow);
transition: box-shadow var(--transition), transform var(--transition);
}
.timeline-card:hover { box-shadow: var(--card-hover); transform: translateX(4px); }
.timeline-degree {
font-size: 11px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--accent);
margin-bottom: 4px;
}
.timeline-school {
font-family: 'Plus Jakarta Sans', sans-serif;
font-size: 17px;
font-weight: 700;
color: var(--text);
margin-bottom: 4px;
}
.timeline-field {
font-size: 14px;
color: var(--text2);
margin-bottom: 10px;
}
.timeline-duration {
display: inline-flex;
align-items: center;
gap: 5px;
font-size: 12px;
color: var(--text3);
background: var(--bg2);
padding: 4px 10px;
border-radius: 50px;
margin-bottom: 14px;
}
.timeline-details {
font-size: 13.5px;
color: var(--text2);
line-height: 1.7;
}
.timeline-details p { margin-bottom: 4px; }
.timeline-details strong { color: var(--text); font-weight: 600; }

/* ─── Skills ────────────────────────────────────────────────── */
.skills-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 16px;
}
.skill-item {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: var(--radius-sm);
padding: 16px 18px;
box-shadow: var(--card-shadow);
transition: box-shadow var(--transition), transform var(--transition);
}
.skill-item:hover { box-shadow: var(--card-hover); transform: translateY(-2px); }
.skill-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}
.skill-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
.skill-dots {
display: flex;
gap: 4px;
}
.skill-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: var(--bg2);
border: 1.5px solid var(--border);
transition: background 0.4s ease, transform 0.3s ease;
}
.skill-dot.filled {
background: linear-gradient(135deg, var(--accent), var(--accent2));
border-color: transparent;
transform: scale(1.1);
}
.skill-bar-track {
height: 5px;
background: var(--bg2);
border-radius: 50px;
overflow: hidden;
}
.skill-bar-fill {
height: 100%;
border-radius: 50px;
background: linear-gradient(90deg, var(--accent), var(--accent2));
width: 0%;
transition: width 1s cubic-bezier(0.4,0,0.2,1);
}

/* ─── Soft Skills ───────────────────────────────────────────── */
.soft-skills-wrap {
display: flex;
flex-wrap: wrap;
gap: 10px;
}
.soft-chip {
padding: 8px 16px;
border-radius: 50px;
font-size: 13px;
font-weight: 500;
background: var(--surface);
border: 1px solid var(--border);
color: var(--text2);
backdrop-filter: blur(8px);
transition: all var(--transition);
cursor: default;
}
.soft-chip:hover {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff;
border-color: transparent;
transform: translateY(-2px);
box-shadow: 0 6px 16px rgba(91,106,240,0.25);
}

/* ─── Languages ─────────────────────────────────────────────── */
.languages-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 16px;
}
.lang-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: var(--radius);
padding: 24px;
text-align: center;
box-shadow: var(--card-shadow);
transition: all var(--transition);
}
.lang-card:hover { box-shadow: var(--card-hover); transform: translateY(-4px); }
.lang-name {
font-family: 'Plus Jakarta Sans', sans-serif;
font-size: 18px;
font-weight: 700;
color: var(--text);
margin-bottom: 8px;
}
.lang-level-label {
font-size: 12px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--accent);
margin-bottom: 14px;
}
.lang-ring {
width: 70px;
height: 70px;
margin: 0 auto;
}
.lang-ring circle {
fill: none;
stroke-width: 6;
stroke-linecap: round;
}
.lang-ring .track { stroke: var(--bg2); }
.lang-ring .fill {
stroke: url(#langGrad);
stroke-dasharray: 188;
stroke-dashoffset: 188;
transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1);
transform: rotate(-90deg);
transform-origin: 50% 50%;
}

/* ─── Courses ───────────────────────────────────────────────── */
.courses-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 16px;
}
.course-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: var(--radius);
padding: 22px;
box-shadow: var(--card-shadow);
transition: all var(--transition);
display: flex;
flex-direction: column;
gap: 8px;
}
.course-card:hover { box-shadow: var(--card-hover); transform: translateY(-4px); }
.course-icon {
width: 36px;
height: 36px;
border-radius: 10px;
background: linear-gradient(135deg, var(--accent), var(--accent2));
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
margin-bottom: 4px;
}
.course-name {
font-size: 14px;
font-weight: 600;
color: var(--text);
line-height: 1.4;
}
.course-inst {
font-size: 12px;
color: var(--accent);
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.5px;
}

/* ─── Publications ──────────────────────────────────────────── */
.pub-list { display: flex; flex-direction: column; gap: 16px; }
.pub-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-radius: var(--radius);
padding: 24px;
box-shadow: var(--card-shadow);
transition: all var(--transition);
display: grid;
grid-template-columns: auto 1fr;
gap: 18px;
align-items: start;
}
.pub-card:hover { box-shadow: var(--card-hover); transform: translateX(6px); }
.pub-year-badge {
background: linear-gradient(135deg, var(--accent), var(--accent2));
color: #fff;
font-size: 12px;
font-weight: 700;
padding: 6px 10px;
border-radius: 8px;
text-align: center;
min-width: 48px;
line-height: 1.3;
}
.pub-title {
font-size: 14.5px;
font-weight: 600;
color: var(--text);
line-height: 1.5;
margin-bottom: 6px;
}
.pub-meta {
display: flex;
flex-wrap: wrap;
gap: 8px;
align-items: center;
}
.pub-journal {
font-size: 12px;
color: var(--accent);
font-weight: 600;
}
.pub-authors {
font-size: 12px;
color: var(--text3);
}
.pub-cited {
font-size: 11px;
background: var(--bg2);
color: var(--text3);
padding: 2px 8px;
border-radius: 50px;
font-weight: 500;
}
.pub-link {
display: inline-flex;
align-items: center;
gap: 4px;
font-size: 12px;
color: var(--accent);
font-weight: 500;
margin-top: 8px;
transition: gap var(--transition);
}
.pub-link:hover { gap: 8px; }

/* ─── Social Links ──────────────────────────────────────────── */
.links-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 14px;
}
.link-card {
background: var(--surface);
border: 1px solid var(--border);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: var(--radius);
padding: 20px;
box-shadow: var(--card-shadow);
transition: all var(--transition);
display: flex;
align-items: center;
gap: 14px;
color: var(--text);
}
.link-card:hover {
box-shadow: var(--card-hover);
transform: translateY(-4px);
color: var(--text);
}
.link-icon {
width: 42px;
height: 42px;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
flex-shrink: 0;
}
.link-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.link-value { font-size: 13px; color: var(--text); font-weight: 600; word-break: break-all; }

/* ─── Footer ────────────────────────────────────────────────── */
footer {
text-align: center;
padding: 40px 20px;
font-size: 13px;
color: var(--text3);
border-top: 1px solid var(--border);
}

/* ─── Responsive ────────────────────────────────────────────── */
@media (max-width: 600px) {
.hero-card { padding: 36px 24px; }
.pub-card { grid-template-columns: 1fr; }
.pub-year-badge { width: fit-content; }
.section { padding: 60px 0; }
}
  </style>
</head>
<body>

  <!-- Animated background -->
  <div class="hero-bg"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
<span class="icon" id="theme-icon">🌙</span>
<span id="theme-label">Dark</span>
  </button>

  <!-- ── HERO ─────────────────────────────────────────────────── -->
  <section class="hero" id="top">
<div class="hero-card">
<div class="avatar-wrap">
<div class="avatar-ring"></div>
<div class="avatar-placeholder" id="hero-avatar">RH</div>
</div>

<h1 class="hero-name" id="hero-name"></h1>
<p class="hero-position" id="hero-position"></p>
<p class="hero-location" id="hero-location">
<span>📍</span><span></span>
</p>

<div class="contact-chips" id="contact-chips"></div>

<nav class="hero-nav">
<button class="nav-pill" onclick="scrollTo('#profile')">Profile</button>
<button class="nav-pill" onclick="scrollTo('#education')">Education</button>
<button class="nav-pill" onclick="scrollTo('#skills')">Skills</button>
<button class="nav-pill" onclick="scrollTo('#courses')">Courses</button>
<button class="nav-pill" onclick="scrollTo('#publications')">Publications</button>
<button class="nav-pill" onclick="scrollTo('#links')">Links</button>
</nav>
</div>
  </section>

  <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
  <main class="container">

<!-- Profile -->
<section class="section" id="profile">
<div class="section-header">
<div class="section-icon">🧠</div>
<h2 class="section-title">Profile</h2>
<div class="section-line"></div>
</div>
<div class="glass-card">
<p class="profile-text" id="profile-text"></p>
</div>
</section>

<!-- Education -->
<section class="section" id="education">
<div class="section-header">
<div class="section-icon">🎓</div>
<h2 class="section-title">Education</h2>
<div class="section-line"></div>
</div>
<div class="timeline" id="education-list"></div>
</section>

<!-- Skills -->
<section class="section" id="skills">
<div class="section-header">
<div class="section-icon">⚡</div>
<h2 class="section-title">Skills</h2>
<div class="section-line"></div>
</div>
<div class="skills-grid" id="skills-grid"></div>
</section>

<!-- Soft Skills -->
<section class="section" id="softskills">
<div class="section-header">
<div class="section-icon">
